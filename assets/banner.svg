<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d5a80" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e63946" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4cc9f0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#glowGrad)"/>

  <!-- Decorative grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Decorative terminal window outline -->
  <rect x="90" y="55" width="1020" height="250" rx="8" fill="none" stroke="#4cc9f0" stroke-opacity="0.08" stroke-width="1.5"/>
  <rect x="90" y="55" width="1020" height="30" rx="8" fill="#4cc9f0" fill-opacity="0.05"/>
  <circle cx="110" cy="70" r="4" fill="#e63946" fill-opacity="0.4"/>
  <circle cx="125" cy="70" r="4" fill="#f4a261" fill-opacity="0.4"/>
  <circle cx="140" cy="70" r="4" fill="#2a9d8f" fill-opacity="0.4"/>

  <!-- Decorative shapes -->
  <circle cx="200" cy="300" r="80" fill="none" stroke="#4cc9f0" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="1000" cy="80" r="60" fill="none" stroke="#e63946" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="1050" cy="280" r="40" fill="none" stroke="#4cc9f0" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Accent lines -->
  <line x1="350" y1="145" x2="850" y2="145" stroke="url(#accentLine)" stroke-width="1"/>
  <line x1="400" y1="215" x2="800" y2="215" stroke="url(#accentLine2)" stroke-width="1"/>

  <!-- Code decoration left -->
  <g fill="none" stroke="#4cc9f0" stroke-opacity="0.06" stroke-width="1.5">
    <polyline points="120,100 140,100 140,120 160,120"/>
    <polyline points="120,130 135,130 135,150 150,150"/>
    <polyline points="120,160 145,160 145,180 170,180"/>
  </g>

  <!-- Code decoration right -->
  <g fill="none" stroke="#e63946" stroke-opacity="0.06" stroke-width="1.5">
    <polyline points="1040,200 1060,200 1060,220 1080,220"/>
    <polyline points="1040,230 1055,230 1055,250 1070,250"/>
    <polyline points="1040,260 1065,260 1065,280 1090,280"/>
  </g>

  <!-- Prompt symbol decoration -->
  <text x="150" y="200" font-family="Consolas, monospace" font-size="14.0" fill="#4cc9f0" fill-opacity="0.08">&gt;_</text>
  <text x="1030" y="160" font-family="Consolas, monospace" font-size="14.0" fill="#e63946" fill-opacity="0.08">$</text>

  <!-- Headline -->
  <text x="600" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58.0" font-weight="bold" fill="#ffffff">
    Qwen 3.5 Max Enterprise Crack
  </text>

  <!-- Tagline -->
  <text x="600" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" fill="#c9d1d9" font-size="17.1">
    Console companion for enterprise teams on Qwen 3.5 Max — manage configs and monitor usage without leaving you…
  </text>

  <!-- Bottom accent bar -->
  <rect x="500" y="275" width="200" height="2" rx="1" fill="#e63946" fill-opacity="0.3"/>
  <rect x="540" y="275" width="120" height="2" rx="1" fill="#4cc9f0" fill-opacity="0.3"/>
</svg>